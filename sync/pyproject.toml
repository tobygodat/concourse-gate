[project]
name = "concourse-sync"
version = "0.1.0"
description = "Concourse Gate worker: shift digests and crowding alerts driven by the Concourse API."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
concourse-sync = "concourse_sync.__main__:main"

[tool.setuptools]
packages = ["concourse_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
